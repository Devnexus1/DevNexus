{% extends 'admin/base.html' %}
{% import 'admin/_macros.html' as ui %}
{% set active = 'password' %}
{% block title %}تغییر رمز{% endblock %}
{% block page_title %}تغییر رمز{% endblock %}

{% block content %}
<form class="card" method="POST" style="max-width:480px">
    {{ ui.csrf() }}
    <div class="field" style="margin-bottom:14px">
        <label for="current_password">رمز فعلی</label>
        <input type="password" id="current_password" name="current_password" class="ltr" autocomplete="current-password" required>
    </div>
    <div class="field" style="margin-bottom:14px">
        <label for="new_password">رمز جدید (حداقل ۸ کاراکتر)</label>
        <input type="password" id="new_password" name="new_password" class="ltr" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="field" style="margin-bottom:18px">
        <label for="confirm_password">تکرار رمز جدید</label>
        <input type="password" id="confirm_password" name="confirm_password" class="ltr" autocomplete="new-password" minlength="8" required>
    </div>
    <button type="submit" class="btn btn-primary">ذخیره‌ی رمز جدید</button>
</form>
{% endblock %}
